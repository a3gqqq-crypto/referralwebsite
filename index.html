    />

    <meta
      name="twitter:title"
      content="Suffrova — Invite friends. Win real prizes."
    />

    <meta
      name="twitter:description"

    <!-- Google Search Console ownership check -->
    <meta name="google-site-verification" content="gdnTxRXnU08Ki1yxaVImST82WQZps-4VRnMxr7DKgas" />

    <!-- SUFFROVA FAVICON (SVG for browsers; ICO/PNG for search engines and phones) -->
    <link rel="icon" href="/favicon.ico?v=5" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Tells Google the site's name and logo for search results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Suffrova",
        "url": "https://www.suffrova.com/",
        "logo": "https://www.suffrova.com/icon-512.png",
        "sameAs": ["https://www.instagram.com/suffrova"]
      }
    </script>

    <title>
      Suffrova — Invite friends. Win real prizes.
    </title>

    <!-- A tab opened before a deploy can request an asset that no longer exists; reload once to pick up the new build. -->
    <script>
      window.addEventListener(
        "error",
        function (event) {
          var el = event.target;
          if (!el || !/^(SCRIPT|LINK)$/.test(el.tagName)) return;
          if (!/\/assets\//.test(el.src || el.href || "")) return;

          try {
            var last = Number(sessionStorage.getItem("vx-asset-reload") || 0);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem("vx-asset-reload", String(Date.now()));
          } catch (e) {
            return;
          }

          location.reload();
        },
        true
      );
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
