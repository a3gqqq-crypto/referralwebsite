<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Basic SEO -->
    <meta
      name="description"
      content="Join Vexora — events, competitions, challenges, rewards and more."
    />

    <meta
      name="theme-color"
      content="#0b0714"
    />

    <!-- Open Graph / Discord / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Vexora"
    />

    <meta
      property="og:title"
      content="Vexora — Events, Competitions & Rewards"
    />

    <meta
      property="og:description"
      content="Join Vexora and take part in exciting events, competitions, challenges and rewards."
    />

    <meta
      property="og:url"
      content="https://joinvexora.com/"
    />

    <meta
      property="og:image"
      content="https://joinvexora.com/referral-preview.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Vexora — Events, Competitions & Rewards"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Vexora — Events, Competitions & Rewards"
    />

    <meta
      name="twitter:description"
      content="Join Vexora and take part in exciting events, competitions, challenges and rewards."
    />

    <meta
      name="twitter:image"
      content="https://joinvexora.com/referral-preview.png"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <title>Vexora — Events, Competitions & Rewards</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
